# Local Docker smoke-test — NOT for production.
#
# docker-compose.yml is the real deployment stack (nginx + Let's Encrypt +
# certbot, needs a public domain). This file runs just the app container,
# published directly on localhost:3000, so you can confirm the Docker image
# itself builds and runs correctly while still in dev. Postgres is published
# on 5433, not 5432, to stay clear of any native Postgres install already
# running on the host.
#
# The `postgres` service here is ALSO how `npm run dev` (running bare on the
# host, not in Docker — including as the backend for
# docker-compose.lan-test.yml) reaches a database: unlike the old SQLite
# file, which needed no setup at all, local dev now requires
# `docker compose -f docker-compose.dev.yml up -d postgres` running first.
#
# Usage:
#   docker compose -f docker-compose.dev.yml up -d postgres   # for `npm run dev`
#   docker compose -f docker-compose.dev.yml up -d --build     # full container smoke-test
#   docker compose -f docker-compose.dev.yml exec app npx tsx prisma/seed.ts
#   docker compose -f docker-compose.dev.yml down

services:
  # Published on the host (unlike the prod compose file's postgres service)
  # so bare `npm run dev` can reach it at localhost:5433, using the
  # POSTGRES_USER/PASSWORD/DB values from the root .env — which Compose
  # auto-loads for variable interpolation in this file too, since it lives
  # in the project directory Compose is run from.
  #
  # Published on 5433, not Postgres's default 5432: a machine that already
  # runs a native Postgres install (or any other local service) on 5432 would
  # otherwise silently steal connections meant for this container — same
  # port, different server, wrong credentials, a confusing "access denied"
  # instead of a clear "port in use". The container's own internal port
  # stays 5432 either way — see the `app` service's DATABASE_URL below,
  # which addresses it as `postgres:5432` over the Docker network.
  postgres:
    image: postgres:17-alpine
    env_file:
      - .env
    ports:
      - "5433:5432"
    volumes:
      - postgres-dev-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U \"$$POSTGRES_USER\" -d \"$$POSTGRES_DB\""]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  app:
    build:
      context: .
      dockerfile: Dockerfile
    image: bagh-e-kabul:dev
    env_file:
      - .env
    environment:
      # Fixed here rather than read from .env: the containerized app reaches
      # Postgres via the Docker network as `postgres:5432` (the service
      # name), while a bare `npm run dev` on the host reaches the same
      # database via the published port at `localhost:5432` — two different
      # hostnames for the same server. ${POSTGRES_*} interpolate from the
      # root .env, which Compose loads automatically for this file.
      NODE_ENV: production
      DATABASE_URL: postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}
    ports:
      - "3000:3000"
    volumes:
      - ./uploads:/app/uploads
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "fetch('http://127.0.0.1:3000/api/health').then(r => process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))",
        ]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s

volumes:
  postgres-dev-data:
