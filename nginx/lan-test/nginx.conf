# Standalone nginx config for LAN/HTTPS testing of the app on a phone, while
# still in dev. Not part of the docker-compose production stack — the app
# runs directly on the host via `npm run dev` (Next's dev server binds
# 0.0.0.0 by default), and this container just terminates TLS with a
# self-signed cert and proxies to it. See next.config.ts's
# `allowedDevOrigins` — it must list this cert's hostname/IP or the dev
# server rejects the proxied requests as cross-origin.
#
# Run with:
#   npm run dev                                            # in one terminal
#   docker compose -f docker-compose.lan-test.yml up -d    # in another
#   docker compose -f docker-compose.lan-test.yml down     # when done

events {}

http {
    server {
        listen 443 ssl;
        listen [::]:443 ssl;
        server_name bagh-e-kabul.local localhost 192.168.1.11;

        ssl_certificate     /etc/nginx/certs/fullchain.pem;
        ssl_certificate_key /etc/nginx/certs/privkey.pem;

        # Dish photo uploads can be up to 5MB — see
        # src/app/api/dishes/[id]/image/route.ts. Some headroom above that.
        client_max_body_size 10m;

        location / {
            proxy_pass http://host.docker.internal:3000;
            proxy_http_version 1.1;

            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;

            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "upgrade";

            proxy_buffering off;
        }
    }
}
