# Replace "your-domain.example" everywhere below with your real domain
# before running nginx/init-letsencrypt.sh.

server {
    listen 80;
    listen [::]:80;
    server_name your-domain.example;

    # Required for Let's Encrypt's HTTP-01 challenge (both the initial
    # issuance and every renewal) to reach the certbot container.
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name your-domain.example;

    ssl_certificate     /etc/letsencrypt/live/your-domain.example/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/your-domain.example/privkey.pem;
    include              /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam          /etc/letsencrypt/ssl-dhparams.pem;

    # AR model files generated via Meshy (.glb/.usdz) can be up to 30MB —
    # see src/app/api/dishes/[id]/ar-generate/route.ts.
    client_max_body_size 35m;

    location / {
        proxy_pass http://app:3000;
        proxy_http_version 1.1;

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";

        # Required for the App Router's streaming/Suspense responses to
        # flush progressively instead of being buffered whole by nginx.
        proxy_buffering off;

        # Live order tracking (src/app/api/orders/[id]/stream) holds a
        # Server-Sent Events connection open for the life of an order. The
        # default 60s read timeout would cut it; the stream's own 25s heartbeat
        # keeps it alive, and this raises the ceiling so a missed beat during a
        # slow moment doesn't drop the customer's tracker.
        proxy_read_timeout 1h;
        proxy_send_timeout 1h;
    }
}
